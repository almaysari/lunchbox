name: Publish household helper page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/helper-page.yml"

permissions:
  contents: write

concurrency:
  group: helper-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch page and images (public Drive files)
        run: |
          set -e
          mkdir -p helper/img/s
          get() { curl -sSL --retry 3 -o "$2" "https://drive.google.com/uc?export=download&id=$1"; echo "$3  $2" | sha256sum -c -; }
          get 16vKy21eAQh7pbBy04UC9FTq7tGaZLgFa helper/index.html            03480ed898ef9afb14facc4c83255006ae9d11a84a49e2477783e62c6cb4a9fe
          get 1obj_aFyaImgm_-A-gRK5QCehql8XsFvk helper/og.jpg                b3525f90c970bb24b2563ff28d602e25ab76b7f1ecc6665e65ff1fd934aa7f2a
          get 1gjVSVnRQKYU90yWKUI0tIP7U7F25IDTY helper/img/s/s0.jpg           2556af8a728acd3a8a85e0c6df756ce47744485ac481dbb4db936aae09976301
          get 1uvV-f1Z8HuPrVEzUTzqBRY4Tgu1PdJdE helper/img/s/s1.jpg           51d6308e7be1c7c7d250daae5b42e83b68902a03fe68f2a8184821128b68d655
          get 16xgBuSgQWYjiWqVMXC6BdWYRew-hERmL helper/img/s/s2.jpg           8dac688069a0507a94cd27a1da90593b3a697adf6ab2ac55802098941091b357
          get 15VYr25dBwkKSZLMuJoUf0UzrmnOZrmiT helper/img/s/s3.jpg           bd94f455370fb458af5fcdaae82fd426b13addeb0fc55e70c05c5ddbfd88e478
          get 1Mt5EGqHLpPcAc1DPAIMI-YwjmtzHJlLU helper/img/cf-lambshoulder.jpg 7b98f818af16f110da90683c3bb0bea46141878a759f370979edaf594530395f
          get 1ZwKezL1EnlgtZFLyJ_CXwrCEKFA7nx8t helper/img/cf-2258136.jpg      8c26327dcf43137467d218efbeff8083c374c8c419b4f9342d7f7970ccb307a4
          touch .nojekyll
          ls -la helper helper/img helper/img/s

      - name: Commit page files
        run: |
          git config user.name "helper-page-bot"
          git config user.email "helper-page-bot@users.noreply.github.com"
          git rm -r -q --ignore-unmatch docs
          git add helper .nojekyll
          git commit -m "Publish household helper page [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
