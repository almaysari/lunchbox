name: Fetch Arabic recipe sources

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated recipe ids (empty = all missing)"
        required: false
        default: ""
      force:
        description: "Refetch even if exists (1/0)"
        required: false
        default: "0"
      mode:
        description: "raw = only fetch raw listing pages"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q requests beautifulsoup4
      - name: Fetch
        env:
          ONLY: ${{ github.event.inputs.only }}
          FORCE: ${{ github.event.inputs.force == '1' && '1' || '' }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          cd cookbook/src
          python fetch_raw.py || true
          if [ "$MODE" != "raw" ]; then python arabic_sources.py; fi
          ls -la ../sources | head -60
      - name: Commit
        run: |
          git config user.name "cookbook-bot"
          git config user.email "cookbook-bot@users.noreply.github.com"
          git add cookbook/sources
          git commit -m "Arabic recipe sources [skip ci]" || echo nothing
          git fetch origin main
          git rebase -X theirs origin/main || (git rebase --abort && git reset --soft origin/main && git commit -m "Arabic recipe sources [skip ci]")
          git push
