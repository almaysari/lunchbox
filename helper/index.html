<html lang="en">

<meta charset="utf-8">

<meta property="og:title" content="Household List">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one-column kitchen app, sticky header, fixed bottom tab bar, full-screen cooking mode. Big touch targets for use with wet hands. */
:root{
  --bg:#f3f5ef;          /* pale sage paper */
  --surface:#ffffff;
  --surface-2:#e8ece2;
  --fg:#1d2419;          /* deep olive ink */
  --muted:#5d6656;
  --line:#d5dbcc;
  --accent:#2f5d3a;      /* za'atar green */
  --accent-fg:#ffffff;
  --saffron:#e3a21a;     /* saffron, used for timers and stars only */
  --saffron-soft:#fbefcf;
  --ok:#2e7d4f; --ok-soft:#dcefe2;
  --warn:#a35d00; --warn-soft:#fbe7c8;
  --bad:#b3261e; --bad-soft:#f8dcd9;
  --shadow:0 1px 2px rgba(29,36,25,.06),0 4px 16px rgba(29,36,25,.06);
  --f-display:'Baloo Bhaijaan 2','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141912;--surface:#1d241a;--surface-2:#262f22;--fg:#e9eee3;--muted:#a3ad99;--line:#33402d;
  --accent:#8cc79a;--accent-fg:#0f1a11;--saffron:#f0b63a;--saffron-soft:#3a2f14;
  --ok:#7fd19c;--ok-soft:#1f3627;--warn:#f0b35a;--warn-soft:#3b2c14;--bad:#ff8a80;--bad-soft:#3d1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141912;--surface:#1d241a;--surface-2:#262f22;--fg:#e9eee3;--muted:#a3ad99;--line:#33402d;
  --accent:#8cc79a;--accent-fg:#0f1a11;--saffron:#f0b63a;--saffron-soft:#3a2f14;
  --ok:#7fd19c;--ok-soft:#1f3627;--warn:#f0b35a;--warn-soft:#3b2c14;--bad:#ff8a80;--bad-soft:#3d1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--fg)}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
.flag{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:800;color:var(--accent);line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.who{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent);color:var(--accent-fg);border:0}

main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 140px}
.view{display:flex;flex-direction:column;gap:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:22px}
.sub{color:var(--muted);font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);min-height:58px;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;inset-inline:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:4px;inset-inline-end:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;font-weight:700}

/* meal slots */
.day-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.day-head h1{font-size:30px;font-weight:800}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.meal-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.meal-h svg{width:22px;height:22px;color:var(--accent);flex:none}
.meal-h h3{font-size:18px;flex:1}
.meal-h .time{font-size:12px;color:var(--muted)}
.dish{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:12px 14px;align-items:center;border-bottom:1px solid var(--line)}
.dish:last-child{border-bottom:0}
.dish img,.ph{width:88px;height:88px;border-radius:10px;object-fit:cover;background:var(--surface-2);display:block}
.ph{display:grid;place-items:center;color:var(--muted);font-size:28px}
.dish-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.dish-name{font-weight:600;font-size:16px;line-height:1.3}
.dish-ar{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.sf{background:var(--saffron-soft);color:var(--warn)}
.empty-slot{padding:14px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}

.note-card{background:var(--saffron-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.note-card svg{width:20px;height:20px;color:var(--warn);flex:none;margin-top:2px}

/* feed */
.feed{display:flex;flex-direction:column;gap:10px}
.feed-item{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.feed-item img,.feed-item .ph{width:64px;height:64px;border-radius:8px}

/* week */
.week{display:flex;flex-direction:column;gap:10px}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.wday.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wday-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.wday-h b{font-family:var(--f-display);font-size:17px}
.wslots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wslot{border:1px dashed var(--line);border-radius:10px;padding:6px;min-height:64px;background:var(--bg);text-align:start;display:flex;flex-direction:column;gap:4px;min-width:0}
.wslot .lbl{font-size:11px;color:var(--muted);font-weight:600}
.wslot .it{font-size:12.5px;line-height:1.3;overflow-wrap:anywhere}
.week-nav{display:flex;align-items:center;gap:8px}

/* recipes */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;white-space:nowrap;font-size:14px;min-height:38px}
.fbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;min-height:46px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.rcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden;text-align:start;padding:0;display:flex;flex-direction:column}
.rcard img,.rcard .ph{width:100%;aspect-ratio:4/3;height:auto;object-fit:cover;border-radius:0;max-width:100%}
.rcard .b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rcard .n{font-weight:600;font-size:14.5px;line-height:1.3}
.rcard .a{font-size:12.5px;color:var(--muted)}

/* sheet / overlay */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-top{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.ov-top-in{max-width:760px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:8px}
.ov-top-in h2{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-body{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
.hero-img{width:100%;max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r);background:var(--surface-2)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.fact .k{font-size:11.5px;color:var(--muted)}
.fact .v{font-weight:600}
.spice{display:flex;align-items:center;gap:8px;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13.5px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.box h3{font-size:17px;margin-bottom:8px}
.ing{display:flex;flex-direction:column}
.ing label{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.ing label:last-child{border-bottom:0}
.ing input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent)}
.ing .q{font-weight:600;white-space:nowrap;text-align:end}
.ing .nt{display:block;font-size:12.5px;color:var(--muted)}
.ing input:checked ~ span{text-decoration:line-through;color:var(--muted)}
ol.steps{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:10px}
ul.plain{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.src{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.src a{color:var(--accent)}
.meat{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.meat dt{color:var(--muted)}
.meat dd{margin:0;font-weight:600}

/* cooking mode */
.cook{display:flex;flex-direction:column;min-height:100%}
.cook-progress{height:6px;background:var(--surface-2)}
.cook-progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.cook-step{flex:1;max-width:760px;margin:0 auto;width:100%;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.cook-part{font-size:13px;color:var(--muted);font-weight:600}
.cook-n{font-family:var(--f-display);font-size:44px;font-weight:800;color:var(--accent);line-height:1}
.cook-text{font-size:22px;line-height:1.5;font-weight:500}
.cook-tr{font-size:17px;line-height:1.55;color:var(--muted);border-inline-start:4px solid var(--saffron);padding-inline-start:12px}
.cook-nav{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.cook-nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.cook-nav .btn{min-height:56px;font-size:17px}
.timers{display:flex;flex-direction:column;gap:8px}
.timer{display:flex;align-items:center;gap:10px;background:var(--saffron-soft);border-radius:12px;padding:8px 12px}
.timer b{font-size:26px;font-variant-numeric:tabular-nums;font-family:var(--f-display);min-width:88px}
.timer.done{background:var(--bad-soft);animation:pulse 1s infinite}
.timer span{flex:1;font-size:13px;color:var(--muted);min-width:0}
@keyframes pulse{50%{opacity:.65}}
@media (prefers-reduced-motion:reduce){.timer.done{animation:none}.cook-progress i{transition:none}}
.finish{display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.finish .big{font-family:var(--f-display);font-size:28px;font-weight:800}
.photo-prev{width:100%;max-width:100%;border-radius:var(--r);aspect-ratio:4/3;object-fit:cover}

/* shopping */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:13.5px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.items{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.cat-ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);overflow:hidden}
.cat-ic svg{width:24px;height:24px}
.cat-ic img{width:44px;height:44px;object-fit:cover}
.item .nm{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.item .meta{font-size:12.5px;color:var(--muted)}
.item .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:34px;height:34px;font-size:18px}
.stepper b{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.cat-h{font-size:13px;font-weight:600;color:var(--muted);padding:12px 2px 6px;display:flex;gap:6px;align-items:center}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:46px}
a.ext{color:var(--accent);font-weight:600;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 4px}

/* history */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hcard img{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.hcard .b{padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;padding:2px;width:36px;height:36px;color:var(--line)}
.stars button.on{color:var(--saffron)}
.stars svg{width:28px;height:28px}
.fb{font-size:14px;background:var(--surface-2);border-radius:10px;padding:8px 10px}
textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:44px;resize:vertical}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;text-align:center}
.login h1{font-size:34px;font-weight:800;color:var(--accent)}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:420px}
.person{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.person .av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-family:var(--f-display);font-size:22px;font-weight:800}
.person[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.pin-dots{display:flex;gap:12px;justify-content:center}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}
.pin-dots i.on{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pad button{height:60px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.langs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.err{color:var(--bad);font-size:14px;min-height:20px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.status-line{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--ok)}
.picker-list{display:flex;flex-direction:column;gap:8px}
.pick{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px;text-align:start}
.pick img,.pick .ph{width:56px;height:56px;border-radius:8px}
.whofor{display:flex;gap:8px}
.vis-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* store */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:row;min-width:0}
.pcard .pimg{width:116px;flex:none;align-self:stretch;min-height:116px;background:#fff;display:grid;place-items:center;overflow:hidden;position:relative}
.pcard .pimg img{width:100%;height:100%;object-fit:contain}
.pcard .pimg .cat-ic{width:56px;height:56px}
.pcard .pb{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.pcard .pn{font-size:13.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

function szTxt(sz){if(!sz)return '';const U=t('u');return sz.replace(/(\d+(?:\.\d+)?)\s*(kg|g|ml|l|pcs|bunch|pkt|oz)\b/g,(m,n,u)=>n+' '+(U[u]||u))}
const WUNIT=p=>{const m=/^(?:(\d+)×)?(\d+(?:\.\d+)?) (g|kg)$/.exec((p&&p.sz)||'');if(!m)return 0;return parseFloat(m[2])*(m[1]?+m[1]:1)*(m[3]==='kg'?1000:1)};
const byWeight=p=>!!WUNIT(p)&&(['veg','fruit','produce','meat','lambb','lambnb','fish'].includes(p.cat)||!!p.approx);
const pcsLabel=p=>{const s=(p&&p.sz)||'';const U=t('u');return /bunch/.test(s)?U.bunch:/pkt/.test(s)?U.pkt:U.pcs};
const famOf=p=>p.fam?st.products.filter(x=>x.fam===p.fam&&x!==p):[];
function famName(k){const f=(st.meta.fams||{})[k];return f?(f[st.lang]||f.en):k}
function famTop(p){const g=p.fam?st.products.filter(x=>x.fam===p.fam):[p];return g.slice().sort((a,b)=>((b.av!==false)-(a.av!==false))||((b.cnt||0)-(a.cnt||0)))[0]||p}
function hName(p){return p.fam&&famOf(p).length?famName(p.fam):p.n}
function groupFam(list){const out=[],idx={};for(const p of list){if(!p.fam){out.push([p]);continue}if(idx[p.fam]==null){idx[p.fam]=out.length;out.push([])}out[idx[p.fam]].push(p)}return out}
const qtyTxt=(p,x)=>x.hu==='kg'?(+x.hq)+' '+t('u').kg:(+x.hq)+' '+pcsLabel(p);
const save=()=>{ls.set('list',st.list);ls.set('free',st.free)};
const entryFor=p=>{if(st.list[p.id])return [p.id,st.list[p.id]];if(p.fam){for(const [pid,x] of Object.entries(st.list)){const q=st.pById[pid];if(q&&q.fam===p.fam)return [pid,x]}}return null};
const count=()=>Object.keys(st.list).length+st.free.length;

/* ---------- render ---------- */
function render(){
  document.documentElement.lang=st.lang==='tl'?'fil':st.lang;document.documentElement.dir=st.lang==='ar'?'rtl':'ltr';
  if(!ls.get('ok',false))return renderPin();
  const n=count();
  $('#app').innerHTML=`<header class="top"><div class="top-in"><div class="brand"><b>${esc(t('app'))}</b><span class="status-line">${esc(t('hTitle'))}</span></div>
   <div class="chips">${['en','ar','tl'].map(l=>`<button class="chip-btn" data-lang="${l}" aria-pressed="${st.lang===l}" ${st.lang===l?'style="background:var(--accent);color:var(--accent-fg);border-color:var(--accent)"':''}>${l==='ar'?'ع':l==='tl'?'TL':'EN'}</button>`).join('')}</div></div></header>
   <main><section class="view">${lastSent()}${st.tab==='items'?itemsHtml():`<div class="sec-h"><h2>${esc(t('hList'))}</h2><span class="sub num">${n}</span></div>`+listHtml()}</section></main>
   <nav class="tabbar" aria-label="Sections"><div class="tabbar-in" style="grid-template-columns:repeat(2,1fr)">${[['items',I.cart,'hItems'],['list',I.list,'hList']].map(([k,ic,l])=>`<button class="tab" data-tab="${k}" ${st.tab===k?'aria-current="page"':''}>${ic}<span>${esc(t(l))}</span>${k==='list'&&n?`<i class="badge num">${n}</i>`:''}</button>`).join('')}</div></nav>`;
  $$('[data-tab]').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;render();window.scrollTo(0,0)});
  $$('[data-lang]').forEach(b=>b.onclick=()=>{st.lang=b.dataset.lang;render()});
  const q=$('#hq');if(q)q.oninput=e=>{st.q=e.target.value;const pos=e.target.selectionStart;render();const n2=$('#hq');n2.focus();try{n2.setSelectionRange(pos,pos)}catch(x){}};
  $$('[data-hc]').forEach(b=>b.onclick=()=>{st.cat=b.dataset.hc;render()});
  $$('[data-hp]').forEach(b=>b.onclick=()=>openQty(b.dataset.hp));
  $$('[data-hpl]').forEach(b=>b.onclick=()=>{bump(st.pById[b.dataset.hpl],1);render()});
  $$('[data-hm]').forEach(b=>b.onclick=()=>{bump(st.pById[b.dataset.hm],-1);render()});
  $$('[data-hx]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-hdel]'))return;openQty(el.dataset.hx)});
  $$('[data-hdel]').forEach(b=>b.onclick=e=>{e.stopPropagation();delete st.list[b.dataset.hdel];save();render()});
  $$('[data-fdel]').forEach(b=>b.onclick=()=>{st.free.splice(+b.dataset.fdel,1);save();render()});
  const ob=$('#hOtherBtn');if(ob)ob.onclick=()=>{const v=$('#hOther').value.trim();if(!v)return;const m=v.match(/^(.*?)(?:\s+(\d+(?:\.\d+)?)\s*(kg|kilo|كيلو|pcs|pc|piraso|حبة)?)?$/i);const hq=m&&m[2]?+m[2]:1;const hu=m&&m[3]&&/^(kg|kilo|كيلو)$/i.test(m[3])?'kg':'pcs';st.free.push({name:(m&&m[1])||v,hq,hu});save();toast(t('hSent'));render()};
  const oi=$('#hOther');if(oi)oi.onkeydown=e=>{if(e.key==='Enter')$('#hOtherBtn').click()};
  const d=$('#hDoneBtn');if(d)d.onclick=openSend;
}
function lastSent(){const d=st.lastAt;return `<div class="note-card" style="padding:8px 12px">${I.clock}<div class="sub" style="color:inherit">${d?esc(t('hLast'))+' <b class="num">'+esc(new Date(d).toLocaleString(locale(),{weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit'}))+'</b>':esc(t('hNever'))}</div></div>`}
function cards(){const q=st.q.toLowerCase();const c=st.cat;const list=st.products.filter(p=>(c==='all'||p.cat===c)&&(!q||p.n.toLowerCase().includes(q)||(p.fam&&famName(p.fam).toLowerCase().includes(q))));return groupFam(list).map(g=>g.length>1?famTop(g[0]):g[0])}
function card(p){const e=entryFor(p);const isFam=p.fam&&famOf(p).length;const unit=byWeight(famTop(p))?t('u').kg:pcsLabel(p);const sel=e?st.pById[e[0]]:null;
  return `<div class="hpc${e?' on':''}"><button class="hc-top" data-hp="${esc(e?e[0]:p.id)}"><span class="hc-im">${pImg(p)}</span><span class="hc-n">${esc(hName(p))}</span><span class="hc-sz">${esc(isFam?(sel||famTop(p)).n:(p.sz?szTxt(p.sz):''))}</span></button>
   <div class="hc-ctl"><button class="hc-b" data-hm="${esc(p.id)}" aria-label="-" ${e?'':'disabled'}>−</button><span class="hc-v num">${e?esc(qtyTxt(sel||p,e[1])):`0 ${esc(unit)}`}</span><button class="hc-b" data-hpl="${esc(p.id)}" aria-label="+">+</button></div></div>`}
function itemsHtml(){const cs=cards();const ks=CATS.filter(k=>cs.some(p=>p.cat===k));const allc=CATS.filter(k=>st.products.some(p=>p.cat===k));
  return `<div class="add-row"><input id="hOther" placeholder="${esc(t('hOther'))}"><button class="btn primary" id="hOtherBtn">${esc(t('add'))}</button></div>
   <input class="search" id="hq" placeholder="${esc(t('search'))}" value="${esc(st.q)}">
   <div class="filters"><button class="fbtn" data-hc="all" aria-pressed="${st.cat==='all'}">${esc(t('all'))}</button>${allc.map(k=>`<button class="fbtn" data-hc="${k}" aria-pressed="${st.cat===k}">${esc(t('cats')[k])}</button>`).join('')}</div>
   ${ks.map(k=>`<div class="hsec"><div class="cat-h">${CAT_IC[k]||CAT_IC.other}<span>${esc(t('cats')[k])}</span><span class="num">(${cs.filter(p=>p.cat===k).length})</span></div><div class="hgrid">${cs.filter(p=>p.cat===k).map(card).join('')}</div></div>`).join('')}`}
function listHtml(){const rows=Object.entries(st.list).map(([pid,x])=>({p:st.pById[pid],x,pid})).filter(r=>r.p);
  if(!rows.length&&!st.free.length)return `<div class="box sub">${esc(t('hEmpty'))}</div>`;
  return `<div class="items">${rows.map(r=>`<div class="item" data-hx="${esc(r.pid)}" role="button" tabindex="0"><span class="cat-ic" style="background:#fff">${pImg(r.p)}</span><div style="min-width:0"><div class="nm">${esc(hName(r.p))}</div><div class="meta"><b class="num">${esc(qtyTxt(r.p,r.x))}</b>${r.x.hn?' · '+esc(r.x.hn):''}</div></div><div class="acts"><button class="iconbtn" data-hdel="${esc(r.pid)}" aria-label="${esc(t('remove'))}">${I.trash}</button></div></div>`).join('')}
   ${st.free.map((f,i)=>`<div class="item"><span class="cat-ic">${CAT_IC.other}</span><div style="min-width:0"><div class="nm">${esc(f.name)}</div><div class="meta"><b class="num">${esc(f.hq)} ${esc(f.hu==='kg'?t('u').kg:t('u').pcs)}</b></div></div><div class="acts"><button class="iconbtn" data-fdel="${i}" aria-label="${esc(t('remove'))}">${I.trash}</button></div></div>`).join('')}</div>
   <button class="btn primary block" id="hDoneBtn" style="min-height:56px;font-size:17px">${I.check}${esc(t('hDone'))} (${count()})</button>`}
function bump(p,dir){const e=entryFor(p);
  if(e){const x=e[1];const base=st.pById[e[0]]||p;const stp=x.hu==='kg'?0.5:1;const nq=Math.round(((+x.hq||1)+dir*stp)*2)/2;if(nq<=0)delete st.list[e[0]];else x.hq=nq;save();return}
  if(dir<0)return;const base=famTop(p);const hu=byWeight(base)?'kg':'pcs';st.list[base.id]={hq:hu==='kg'?1:(base.uq||1),hu,hn:''};save()}

/* ---------- overlay ---------- */
function showOverlay(title,body,bind){const o=$('#ovl');o.hidden=false;document.body.style.overflow='hidden';o.className='overlay';
  o.innerHTML=`<div class="ov-top"><div class="ov-top-in"><button class="iconbtn" id="ovClose" aria-label="Close">${I.close}</button><h2>${esc(title)}</h2></div></div><div class="ov-body">${body}</div>`;
  $('#ovClose').onclick=closeOverlay;if(bind)bind()}
function closeOverlay(){const o=$('#ovl');o.hidden=true;o.innerHTML='';document.body.style.overflow='';render()}
function openQty(pid){let p=st.pById[pid];if(!p)return;const vars=p.fam?st.products.filter(v=>v.fam===p.fam):[p];const e=entryFor(p);if(!e&&vars.length>1)p=famTop(p);if(e)p=st.pById[e[0]]||p;
  const w=byWeight(p);let hu=e?(e[1].hu||'pcs'):(w?'kg':'pcs');let hq=e?(+e[1].hq||1):(hu==='kg'?1:(p.uq||1));let note=e?(e[1].hn||''):'';
  const step=()=>hu==='kg'?0.5:1;
  const draw=()=>{const unitL=hu==='kg'?t('u').kg:pcsLabel(p);
    showOverlay(hName(p),`<div class="hq-wrap"><div class="hq-im">${pImg(p)}</div><div class="hq-n">${esc(hName(p))}</div>${p.sz?`<div class="sub">${esc(p.n)} · ${esc(szTxt(p.sz))}</div>`:''}
     ${vars.length>1?`<div class="hvars">${vars.map(v=>`<button class="hvar" data-hvar="${esc(v.id)}" aria-pressed="${v.id===p.id}"><span class="v-im">${pImg(v)}</span><span>${esc(v.n)}</span></button>`).join('')}</div>`:''}
     ${w?`<div class="seg" style="grid-template-columns:1fr 1fr"><button data-hu="kg" aria-pressed="${hu==='kg'}">${esc(t('hKg'))}</button><button data-hu="pcs" aria-pressed="${hu==='pcs'}">${esc(t('hPcs'))}</button></div>`:''}
     <div class="eyebrow">${esc(t('hHow'))}</div>
     <div class="hq-ctl"><button class="hq-b" id="hqm" aria-label="-">−</button><div class="hq-v"><b class="num">${hq}</b><span>${esc(unitL)}</span></div><button class="hq-b" id="hqp" aria-label="+">+</button></div>
     ${hu==='kg'?`<div class="chips" style="justify-content:center">${[0.5,1,2,3,5].map(v=>`<button class="fbtn" data-hv="${v}" aria-pressed="${hq===v}">${v} ${esc(t('u').kg)}</button>`).join('')}</div>`:''}
     <input class="search" id="hqn" placeholder="${esc(t('hNote'))}" value="${esc(note)}">
     <button class="btn primary block" id="hqOk" style="min-height:56px;font-size:17px">${I.check}${esc(e?t('hUpd'):t('hAdd'))}</button>
     ${e?`<button class="btn ghost block" id="hqDel">${I.trash}${esc(t('remove'))}</button>`:''}</div>`,()=>{
      const o=$('#ovl');
      o.querySelectorAll('[data-hvar]').forEach(b=>b.onclick=()=>{p=st.pById[b.dataset.hvar]||p;draw()});
      o.querySelectorAll('[data-hu]').forEach(b=>b.onclick=()=>{hu=b.dataset.hu;hq=hu==='kg'?1:(p.uq||1);draw()});
      o.querySelectorAll('[data-hv]').forEach(b=>b.onclick=()=>{hq=+b.dataset.hv;draw()});
      $('#hqm').onclick=()=>{hq=Math.max(step(),Math.round((hq-step())*2)/2);draw()};
      $('#hqp').onclick=()=>{hq=Math.round((hq+step())*2)/2;draw()};
      $('#hqn').oninput=ev=>{note=ev.target.value};
      const d=$('#hqDel');if(d)d.onclick=()=>{if(e)delete st.list[e[0]];save();closeOverlay()};
      $('#hqOk').onclick=()=>{if(e&&e[0]!==p.id)delete st.list[e[0]];st.list[p.id]={hq,hu,hn:note.trim()};save();toast(t('hSent'));closeOverlay()}});
  };draw();
}
/* ---------- send ---------- */
function buildMessage(){const rows=Object.entries(st.list).map(([pid,x])=>({p:st.pById[pid],x})).filter(r=>r.p);
  const when=new Date().toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const lines=rows.map(r=>`- ${r.p.n}: ${r.x.hu==='kg'?r.x.hq+' kg':r.x.hq+' pcs'}${r.x.hn?' ('+r.x.hn+')':''}`).concat(st.free.map(f=>`- *${f.name}: ${f.hq} ${f.hu==='kg'?'kg':'pcs'}`));
  const code='HK1'+rows.map(r=>'-'+st.idx[r.p.id]+(r.x.hu==='kg'?'k'+Math.round(r.x.hq*10):'p'+Math.round(r.x.hq))).join('');
  return {text:`Home Kitchen list ${when}\n${lines.join('\n')}\n\nOpen: ${APP}#h${code.slice(3)}\nCode: ${code}`,n:rows.length+st.free.length}}
function openSend(){const m=buildMessage();if(!m.n)return;const wa=WA&&/^\d{8,15}$/.test(WA)?`https://wa.me/${WA}?text=${encodeURIComponent(m.text)}`:'';
  showOverlay(t('hDone'),`<div class="hq-wrap"><div class="sub">${esc(t('hSendHow'))}</div>
   ${wa?`<a class="btn primary block" id="waBtn" href="${esc(wa)}" target="_blank" rel="noopener" style="min-height:60px;font-size:18px;background:#1fa855;border-color:#1fa855">${I.check}${esc(t('hWa'))}</a>`:''}
   <button class="btn block" id="cpBtn">${esc(t('hCopy'))}</button>
   <textarea id="msgBox" readonly style="min-height:160px;font-size:13px;direction:ltr;text-align:left">${esc(m.text)}</textarea>
   <button class="btn ghost block" id="newBtn">${esc(t('hStart'))}</button></div>`,()=>{
    const done=()=>{st.lastAt=Date.now();ls.set('lastAt',st.lastAt)};
    const wb=$('#waBtn');if(wb)wb.onclick=()=>{done();setTimeout(()=>toast(t('hDoneT')),500)};
    $('#cpBtn').onclick=async()=>{try{await navigator.clipboard.writeText(m.text)}catch(e){const b=$('#msgBox');b.focus();b.select();try{document.execCommand('copy')}catch(x){}}done();toast(t('hCopied'))};
    $('#newBtn').onclick=()=>{st.list={};st.free=[];save();closeOverlay()}});
}
/* ---------- pin ---------- */
function renderPin(){
  $('#app').innerHTML=`<div class="login"><h1>${esc(t('app'))}</h1><div><div style="font-weight:600;font-size:17px">${esc(t('hPinT'))}</div><div class="sub">${esc(t('hPinS'))}</div></div>
   <div class="pin-dots" dir="ltr">${[0,1,2,3,4,5,6,7].map(i=>`<i class="${i<st.pin.length?'on':''}"></i>`).join('')}</div><div class="err">${st.pinErr?esc(t('hPinErr')):''}</div>
   <div class="pad" dir="ltr">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-pk="${k}">${k}</button>`).join('')}</div>
   <div class="langs">${['en','ar','tl'].map(l=>`<button class="chip-btn" data-lang="${l}" aria-pressed="${st.lang===l}">${l==='ar'?'ع':l==='tl'?'TL':'EN'}</button>`).join('')}</div></div>`;
  $$('[data-lang]').forEach(b=>b.onclick=()=>{st.lang=b.dataset.lang;render()});
  $$('[data-pk]').forEach(b=>b.onclick=()=>{const k=b.dataset.pk;st.pinErr=false;if(k==='⌫')st.pin=st.pin.slice(0,-1);else if(st.pin.length<8)st.pin+=k;
    if(st.pin.length===8){if(st.pin===HPIN){ls.set('ok',true);st.pin='';render();return}st.pinErr=true;st.pin='';try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}render()});
}
/* ---------- boot ---------- */
async function boot(){render();
  try{const ps=window.__PRODUCTS||await fetch('products.json').then(r=>r.json());st.meta=ps.meta||{};st.products=ps.items||ps;st.products.forEach((p,i)=>{st.pById[p.id]=p;st.idx[p.id]=i})}catch(e){console.warn('data',e)}
  for(const pid of Object.keys(st.list))if(!st.pById[pid])delete st.list[pid];
  render()}
boot();
})();

</script>
</body></html>
