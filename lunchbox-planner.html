<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لانش بوكس بلانر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f5f0e8;--card:#fff;--accent:#c8522a;--accent2:#e8a87c;
    --green:#4a7c59;--text:#2a2118;--muted:#8a7a6a;
    --border:#e0d5c5;--shadow:0 4px 24px rgba(42,33,24,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 80px}
  header{background:var(--accent);color:white;padding:22px 20px 16px;text-align:center;position:relative;overflow:hidden}
  header::before{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
  header h1{font-size:21px;font-weight:800}
  header p{font-size:11px;opacity:.8;margin-top:3px}
  .box-legend{display:flex;gap:7px;justify-content:center;margin:12px 10px 0;flex-wrap:wrap}
  .box-badge{display:flex;align-items:center;gap:5px;background:white;border-radius:20px;padding:4px 11px;font-size:10px;font-weight:600;color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.07)}
  .box-dot{width:8px;height:8px;border-radius:50%}
  .dot1{background:var(--accent)}.dot2{background:var(--green)}.dot3{background:var(--accent2)}.dot4{background:#9b7fb6}
  .week-nav{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:white;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .week-nav button{background:none;border:1.5px solid var(--border);border-radius:7px;padding:5px 11px;font-family:'Tajawal',sans-serif;font-size:11px;cursor:pointer;color:var(--text);transition:all .2s}
  .week-nav button:hover{background:var(--accent);color:white;border-color:var(--accent)}
  .week-nav h2{font-size:12px;font-weight:700;text-align:center}
  .days-container{padding:10px;display:flex;flex-direction:column;gap:12px}
  .day-card{background:var(--card);border-radius:13px;overflow:hidden;box-shadow:var(--shadow);border:1.5px solid var(--border)}
  .day-header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;color:white}
  .day-name{font-size:13px;font-weight:700}
  .day-date{font-size:10px;opacity:.75}
  .boxes-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
  .box-section{background:var(--card);padding:11px}
  .box-section.full-width{grid-column:1/-1}
  .box-label{font-size:10px;font-weight:700;letter-spacing:.3px;margin-bottom:7px;display:flex;align-items:center;gap:5px;color:var(--muted)}
  .box-label span{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
  .cat-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
  .cat-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:14px;padding:3px 8px;font-family:'Tajawal',sans-serif;font-size:10px;cursor:pointer;color:var(--text);font-weight:600;transition:all .15s}
  .cat-btn:hover{border-color:var(--accent);color:var(--accent)}
  .cat-btn.active{background:var(--accent);color:white;border-color:var(--accent)}
  .cat-btn.active-orange{background:var(--accent2);color:white;border-color:var(--accent2)}
  .items-select{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:6px 9px;font-family:'Tajawal',sans-serif;font-size:11px;color:var(--text);background:var(--bg);appearance:none;cursor:pointer}
  .items-select:focus{outline:none;border-color:var(--accent)}
  .dish-info{margin-top:7px;background:#fff9f5;border:1.5px solid #f0ddd0;border-radius:9px;padding:9px 11px;display:none}
  .dish-info.show{display:block}
  .dish-info-name{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:3px}
  .dish-info-desc{font-size:10px;color:var(--text);line-height:1.7;margin-bottom:5px}
  .dish-info-qty{font-size:9px;color:var(--green);font-weight:600;background:#f0f7f3;border-radius:5px;padding:3px 7px;display:inline-block}
  .salad-info{margin-top:5px;font-size:10px;color:var(--muted);display:none;background:#f5faf7;border-radius:6px;padding:5px 8px;border:1px solid #d5ead9;line-height:1.6}
  .salad-info.show{display:block}
  .sauce-row{display:flex;flex-wrap:wrap;gap:4px}
  .sauce-chip{background:var(--bg);border:1.5px solid var(--border);border-radius:9px;padding:3px 7px;font-size:10px;cursor:pointer;font-family:'Tajawal',sans-serif;transition:all .15s;font-weight:600}
  .sauce-chip.active{background:#9b7fb6;color:white;border-color:#9b7fb6}
  .notes-input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:6px 9px;font-family:'Tajawal',sans-serif;font-size:10px;resize:none;height:42px;background:var(--bg);color:var(--text)}
  .notes-input:focus{outline:none;border-color:var(--accent)}
  .actions{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1.5px solid var(--border);padding:9px 14px;display:flex;gap:8px;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
  .btn-print{flex:1;background:var(--accent);color:white;border:none;border-radius:10px;padding:13px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
  .btn-reset{background:var(--bg);color:var(--text);border:1.5px solid var(--border);border-radius:10px;padding:13px 14px;font-family:'Tajawal',sans-serif;font-size:11px;font-weight:600;cursor:pointer}
  #print-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;padding:14px;overflow-y:auto}
  #print-modal.show{display:flex;align-items:flex-start;justify-content:center}
  .print-card{background:white;border-radius:16px;padding:20px;max-width:500px;width:100%;margin:12px auto;direction:ltr}
  .print-header{text-align:center;margin-bottom:18px;border-bottom:2px solid #f0f0f0;padding-bottom:14px}
  .print-header h2{font-size:17px;font-weight:800;color:#c8522a}
  .print-header .ph-sub{font-size:11px;color:#888;margin-top:2px}
  .print-header .ph-week{font-size:10px;color:#aaa;margin-top:2px}
  .print-day{margin-bottom:18px;border:1.5px solid #eee;border-radius:11px;overflow:hidden}
  .print-day-header{color:white;padding:8px 13px;display:flex;justify-content:space-between;align-items:center}
  .pday{font-size:12px;font-weight:700}
  .pdate{font-size:9px;opacity:.75}
  .print-day-body{padding:11px 13px}
  .print-no-sel{font-size:10px;color:#aaa;font-style:italic;text-align:center;padding:6px 0}
  .print-box{margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed #eee}
  .print-box:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
  .print-box-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#aaa;margin-bottom:5px}
  .print-dish-name{font-size:13px;font-weight:700;color:#2a2118}
  .print-dish-ar{font-size:9px;color:#aaa;margin-bottom:4px}
  .print-qty-badge{display:inline-block;background:#e8f5ec;color:#3a6b49;font-size:9px;font-weight:600;border-radius:4px;padding:2px 6px;margin-bottom:5px}
  .print-steps{counter-reset:step}
  .print-step{font-size:10px;color:#444;padding:2px 0 2px 16px;position:relative;line-height:1.7}
  .print-step::before{content:counter(step);counter-increment:step;position:absolute;left:0;background:#c8522a;color:white;border-radius:50%;width:12px;height:12px;font-size:8px;display:flex;align-items:center;justify-content:center;top:3px}
  .print-notes-box{background:#fff9f0;border:1px solid #f0ddd0;border-radius:7px;padding:7px 9px;margin-top:5px}
  .print-notes-box p{font-size:10px;color:#666}
  .modal-actions{display:flex;gap:8px;margin-top:16px}
  .btn-close-modal{flex:1;padding:10px;background:#f5f0e8;border:1.5px solid #e0d5c5;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:12px;cursor:pointer;font-weight:600}
  .btn-do-print{flex:1;padding:10px;background:#c8522a;color:white;border:none;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:12px;cursor:pointer;font-weight:700}
  @media print{
    body *{visibility:hidden}
    #print-modal,#print-modal *{visibility:visible}
    #print-modal{position:absolute;inset:0;background:white;padding:0;display:block !important}
    .modal-actions{display:none}
    .print-card{box-shadow:none;border-radius:0;margin:0;max-width:100%}
  }
</style>
</head>
<body>
<header>
  <h1>🍱 لانش بوكس بلانر</h1>
  <p>اختر وجبتك – ورقة الخادمة تطلع بالفلبيني مع الكميات والخطوات</p>
</header>
<div class="box-legend">
  <div class="box-badge"><span class="box-dot dot1"></span>بوكس ١ الطبق</div>
  <div class="box-badge"><span class="box-dot dot2"></span>بوكس ٢ السلطة</div>
  <div class="box-badge"><span class="box-dot dot3"></span>بوكس ٣ الفاكهة</div>
  <div class="box-badge"><span class="box-dot dot4"></span>بوكس ص الصوص</div>
</div>
<div class="week-nav">
  <button onclick="changeWeek(-1)">◀ السابق</button>
  <h2 id="week-label"></h2>
  <button onclick="changeWeek(1)">القادم ▶</button>
</div>
<div class="days-container" id="days-container"></div>
<div class="actions">
  <button class="btn-reset" onclick="resetAll()">🔄 مسح</button>
  <button class="btn-print" onclick="showPrint()">📋 ورقة الخادمة (Filipino)</button>
</div>
<div id="print-modal">
  <div class="print-card">
    <div class="print-header">
      <h2>🍱 Lunch Box Schedule</h2>
      <div class="ph-sub">Patnubay sa Pagluluto — Cooking Guide</div>
      <div class="ph-week" id="print-week-label"></div>
    </div>
    <div id="print-content"></div>
    <div class="modal-actions">
      <button class="btn-close-modal" onclick="closePrint()">إغلاق</button>
      <button class="btn-do-print" onclick="window.print()">🖨️ طباعة / Print</button>
    </div>
  </div>
</div>

<script>
const DAYS_AR=['الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DAYS_FIL=['Lunes','Martes','Miyerkules','Huwebes','Biyernes','Sabado'];

    {ar:'شيش طاووق',fil:'Shish Tawook',

     desc_fil:'Chicken cubes marinated in lemon, garlic and yogurt then grilled',
     qty_ar:'٢٠٠ غرام صدر دجاج مقطع مكعبات، ليمونة، ٢ فص ثوم، ملعقة بهارات شيش طاووق، ٢ ملعقة لبن',
     qty_fil:'200g chicken breast cubed, 1 lemon (juice only), 2 garlic cloves minced, 1 tsp shish tawook spice, 2 tbsp yogurt, salt',
     steps_fil:['Mix marinade: lemon + garlic + spice + yogurt + salt in a bowl','Add chicken cubes, mix well to coat all pieces','Marinate in fridge minimum 2 hours – overnight is much better','Grill on hot pan or grill 4-5 min each side until golden and slightly charred edges','Do NOT put hot chicken in closed box – wait 15 min to cool first']},
    {ar:'فلافل لف',fil:'Falafel Wrap',
     desc_ar:'كرات فلافل مقلية داخل خبز مرق مع خيار وطماطم وطحينة',
     desc_fil:'Crispy fried falafel balls wrapped in flatbread with fresh vegetables and tahini',
     qty_ar:'٦ حبات فلافل جاهزة، خبز مرق، خيار وطماطم مقطعة، خس، طحينة',
     qty_fil:'6 falafel balls (ready-made ok), 1 flatbread, sliced cucumber + tomato, lettuce leaves, tahini',
     steps_fil:['Fry falafel in hot oil – outside must be DARK BROWN, not light, or it will be soft and fall apart','Drain on paper towels, let cool completely – 15 min minimum','Warm flatbread in dry pan 30 sec so it becomes soft and foldable','Layer on bread: lettuce → tomato → cucumber → falafel balls','Roll tightly and wrap in foil to keep shape','Put tahini in separate small box so bread does not get soggy']},
    {ar:'مجدرة',fil:'Mujaddara',

     desc_fil:'Rice and lentils cooked together topped with deeply caramelized crispy onion',
     qty_ar:'نصف كوب أرز، نصف كوب عدس بني، بصلة كبيرة، ملعقة كمون، زيت، ملح',
     qty_fil:'½ cup rice, ½ cup brown lentils, 1 large onion sliced very thin, 1 tsp cumin, oil, salt',
     steps_fil:['Boil lentils in 2 cups water for 15 min until just tender but NOT mushy','Cook rice separately with cumin and salt until done','Fry onion slices in generous oil on LOW heat – takes 20-25 min stirring often until very dark brown and crispy – this step is the whole flavor of the dish, do not rush it','Combine rice and lentils, mix gently','Top with all the crispy fried onion when packing']},
  ],
  '🇦🇪 إماراتي':[
    {ar:'كبسة دجاج',fil:'Kabsa',

     qty_ar:'١ كوب أرز بسمتي، ٢ فخذة دجاج، ٢ ملعقة بهارات كبسة، بصل، طماطم، زيت، ملح',
     qty_fil:'1 cup basmati rice (washed), 2 chicken thighs, 2 tsp kabsa spice mix, 1 onion, 1 tomato, oil, salt, 2 cups water',
     steps_fil:['Heat oil in deep pot, brown chicken pieces on all sides until golden – remove and set aside','In same pot fry onion until soft, add chopped tomato, cook 5 min','Add kabsa spice and 2 cups water, bring to boil','Add washed rice, place chicken pieces on top, cover tightly','Cook on LOW heat 20 min – do NOT open lid or lift it during cooking','After 20 min, check rice is dry and fluffy – let rest 5 min before opening','Cool completely before packing in lunch box']},
    {ar:'مجبوس دجاج',fil:'Machboos',
     desc_ar:'مثل الكبسة لكن بصلصة طماطم أكثر وزعفران – طعمه أغنى وأعمق',

     steps_fil:['Follow exact kabsa steps','Add tomato paste when frying the onion','Add dissolved saffron water just before closing the lid','The rice should come out deep golden-orange color – this is correct','If color is pale yellow, saffron was not enough next time']},

     qty_ar:'نصف كوب قمح هريس منقوع من الليل، ٢٠٠ غرام دجاج مسلوق ومفتت، سمن، قرفة، ملح',

    {ar:'ثريد دجاج',fil:'Thareed',
     desc_ar:'خبز رقيق مبلل بمرق الدجاج الغني مع الخضار – طبق تراثي إماراتي',

     steps_fil:['Boil chicken with vegetables (potato, carrot, zucchini) until all are cooked – keep broth','Tear bread into medium pieces, place at bottom of lunch box','Add chicken pieces and vegetables on top of bread','Pour hot broth over everything – bread will absorb it, this is intentional and correct','The bread should be wet but not swimming in liquid – adjust amount of broth accordingly']},

     steps_fil:['Open can and drain – or use boiled fava beans','Heat in pan, mash about half with fork – keep other half whole, this gives nice texture','Add garlic + cumin + lemon juice + salt + drizzle of olive oil','Stir and cook on low heat 5-7 min until fragrant','Chop parsley, add on top with extra drizzle of olive oil','Serve with Arabic bread on side – wrap bread separately so it stays fresh']},

     qty_fil:'200g ground beef or lamb, 1 small onion grated (squeeze out water), handful parsley finely chopped, 1 tsp kofta spice, salt, black pepper',
     steps_fil:['Grate onion and SQUEEZE out the juice with your hands – too much moisture makes kofta fall apart','Mix all ingredients well, knead like dough for 2-3 min','Wet hands with water, shape into finger shapes – press firmly so they hold together','Grill on HIGH heat 3-4 min each side – must be well cooked, no pink inside','Let cool on rack 10 min – do NOT cover with lid while hot, they will steam and become soft']},
  ],

let weekOffset=0, selections={};

function getWeekDates(){
  const now=new Date(), day=now.getDay();
  const diff=day===0?-6:1-day;
  const monday=new Date(now);
  monday.setDate(now.getDate()+diff+weekOffset*7);
  return DAYS_AR.map((_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
}
function fmtAR(d){return d.toLocaleDateString('ar-AE',{day:'numeric',month:'long'})}
function fmtEN(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}

function updateWeekLabel(){
  const dates=getWeekDates();
  document.getElementById('week-label').textContent=fmtAR(dates[0])+' – '+fmtAR(dates[5]);
}
function changeWeek(dir){weekOffset+=dir;updateWeekLabel();renderDays();}

function getSel(i){
  if(!selections[weekOffset])selections[weekOffset]={};
  if(!selections[weekOffset][i])selections[weekOffset][i]={cat:'',main:'',salad:'',fruits:[],sauces:[],notes:''};
  return selections[weekOffset][i];
}
function getDish(cat,ar){
  if(!cat||!ar)return null;
  return(MAIN_DISHES[cat]||[]).find(d=>d.ar===ar)||null;
}

function renderDays(){
  const dates=getWeekDates();
  const cont=document.getElementById('days-container');
  cont.innerHTML='';
  DAYS_AR.forEach((day,i)=>{
    const sel=getSel(i);
    const dish=getDish(sel.cat,sel.main);
    const hdr=sel.main?'var(--green)':'var(--text)';
    const catBtns=Object.keys(MAIN_DISHES).map(c=>`<button class="cat-btn ${sel.cat===c?'active':''}" onclick="selectCat(${i},'${c.replace(/'/g,"\\'")}')"> ${c}</button>`).join('');
    const dishOpts=sel.cat&&MAIN_DISHES[sel.cat]?MAIN_DISHES[sel.cat].map(d=>`<option value="${d.ar}" ${sel.main===d.ar?'selected':''}>${d.ar}</option>`).join(''):'';
    const dishInfo=dish?`<div class="dish-info show"><div class="dish-info-name">${dish.ar}</div><div class="dish-info-desc">${dish.desc_ar}</div><div class="dish-info-qty">📏 ${dish.qty_ar}</div></div>`:'';
    const saladOpts=SALADS.map(s=>`<option value="${s.ar}" ${sel.salad===s.ar?'selected':''}>${s.ar}</option>`).join('');
    const saladObj=SALADS.find(s=>s.ar===sel.salad);
    const saladInfo=saladObj?`<div class="salad-info show">${saladObj.info_ar}</div>`:'<div class="salad-info"></div>';
    const fruitBtns=FRUITS.map(f=>`<button class="cat-btn ${sel.fruits.includes(f.ar)?'active-orange':''}" onclick="toggleFruit(${i},'${f.ar}')">${f.ar}</button>`).join('');
    const sauceChips=SAUCES.map(s=>`<button class="sauce-chip ${sel.sauces.includes(s.ar)?'active':''}" onclick="toggleSauce(${i},'${s.ar}')">${s.ar}</button>`).join('');
    const card=document.createElement('div');
    card.className='day-card';
    card.innerHTML=`
      <div class="day-header" style="background:${hdr}">
        <span class="day-name">${day}</span><span class="day-date">${fmtAR(dates[i])}</span>
      </div>
      <div class="boxes-grid">
        <div class="box-section full-width">
          <div class="box-label"><span style="background:var(--accent)"></span>بوكس ١ – الطبق الرئيسي</div>
          <div class="cat-row">${catBtns}</div>
          <select class="items-select" onchange="selectMain(${i},this.value)">
            <option value="">-- اختر الطبق --</option>${dishOpts}
          </select>
          ${dishInfo}
        </div>
        <div class="box-section">
          <div class="box-label"><span style="background:var(--green)"></span>بوكس ٢ – السلطة</div>
          <select class="items-select" onchange="selectSalad(${i},this.value)">
            <option value="">-- اختر --</option>${saladOpts}
          </select>
          ${saladInfo}
        </div>
        <div class="box-section">
          <div class="box-label"><span style="background:var(--accent2)"></span>بوكس ٣ – فاكهة</div>
          <div class="cat-row">${fruitBtns}</div>
        </div>
        <div class="box-section full-width">
          <div class="box-label"><span style="background:#9b7fb6"></span>بوكس ص – الصوص</div>
          <div class="sauce-row">${sauceChips}</div>
        </div>
        <div class="box-section full-width">
          <div class="box-label">📝 ملاحظات للخادمة</div>
          <textarea class="notes-input" placeholder="مثال: بدون بصل، بارد فقط..." onchange="setNotes(${i},this.value)">${sel.notes}</textarea>
        </div>
      </div>`;
    cont.appendChild(card);
  });
}

function selectCat(i,cat){getSel(i).cat=cat;getSel(i).main='';renderDays();}
function selectMain(i,val){getSel(i).main=val;renderDays();}
function selectSalad(i,val){getSel(i).salad=val;renderDays();}
function toggleFruit(i,fruit){const s=getSel(i),idx=s.fruits.indexOf(fruit);if(idx>-1)s.fruits.splice(idx,1);else if(s.fruits.length<3)s.fruits.push(fruit);renderDays();}
function toggleSauce(i,sauce){const s=getSel(i),idx=s.sauces.indexOf(sauce);if(idx>-1)s.sauces.splice(idx,1);else s.sauces.push(sauce);renderDays();}
function setNotes(i,val){getSel(i).notes=val;}
function resetAll(){if(confirm('تمسح كل الاختيارات؟')){delete selections[weekOffset];renderDays();}}

function showPrint(){
  const dates=getWeekDates();
  document.getElementById('print-week-label').textContent='Week: '+fmtEN(dates[0])+' to '+fmtEN(dates[5]);
  let html='';
  DAYS_AR.forEach((dayAr,i)=>{
    const sel=getSel(i), dish=getDish(sel.cat,sel.main);
    const hasAny=sel.main||sel.salad||sel.fruits.length;
    html+=`<div class="print-day">
      <div class="print-day-header" style="background:${hasAny?'#4a7c59':'#777'}">
        <span class="pday">${DAYS_FIL[i]} — ${dayAr}</span>
        <span class="pdate">${fmtEN(dates[i])}</span>
      </div>
      <div class="print-day-body">`;
    if(!hasAny){html+=`<p class="print-no-sel">Walang napili / لم يتم الاختيار</p>`;}
    else{
      if(dish){
        html+=`<div class="print-box">
          <div class="print-box-label">🔴 BOX 1 — Main Dish</div>
          <div class="print-dish-name">${dish.fil}</div>
          <div class="print-dish-ar">(${dish.ar})</div>
          <div class="print-qty-badge">📏 ${dish.qty_fil}</div>
          <div class="print-steps">${dish.steps_fil.map(s=>`<div class="print-step">${s}</div>`).join('')}</div>
          <p style="font-size:9px;color:#bbb;margin-top:5px">⚠️ Palaging palamigin ang pagkain bago isara ang lunch box.</p>
        </div>`;
      }
      if(sel.salad){
        const so=SALADS.find(s=>s.ar===sel.salad);
        if(so)html+=`<div class="print-box">
          <div class="print-box-label">🟢 BOX 2 — Salad</div>
          <div class="print-dish-name">${so.fil}</div>
          <div class="print-dish-ar">(${so.ar})</div>
          <p style="font-size:10px;color:#444;margin-top:4px;line-height:1.6">${so.info_fil}</p>
        </div>`;
      }
      if(sel.fruits.length){
        html+=`<div class="print-box">
          <div class="print-box-label">🟠 BOX 3 — Fruits</div>
          ${sel.fruits.map(fa=>{const fo=FRUITS.find(f=>f.ar===fa);return fo?`<div style="margin-bottom:5px"><strong style="font-size:12px">${fo.fil}</strong> <span style="font-size:9px;color:#aaa">(${fo.ar})</span><br><span style="font-size:10px;color:#555">→ ${fo.prep}</span></div>`:''}).join('')}
        </div>`;
      }
      if(sel.sauces.length){
        html+=`<div class="print-box">
          <div class="print-box-label">🟣 SMALL BOX — Sauce</div>
          <p style="font-size:11px;color:#333">${sel.sauces.map(sa=>{const so=SAUCES.find(s=>s.ar===sa);return so?`${so.fil} (${so.ar})`:sa}).join(' + ')}</p>
          <p style="font-size:9px;color:#aaa;margin-top:3px">Put each sauce in a separate small container with a lid.</p>
        </div>`;
      }
      if(sel.notes)html+=`<div class="print-notes-box"><p>📝 <strong>Special note:</strong> ${sel.notes}</p></div>`;
    }
    html+=`</div></div>`;
  });
  html+=`<div style="margin-top:14px;padding:10px;background:#f9f9f9;border-radius:8px;text-align:center">
    <p style="font-size:10px;color:#888;font-weight:700">⚠️ Mahalagang Paalala – Important Reminders</p>
    <p style="font-size:9px;color:#666;margin-top:4px;line-height:1.7">
      • Palaging palamigin muna bago isara ang box (Always cool food before closing)<br>
      • Sauces at dressings – separate small box palagi (Always keep sauces separate)<br>
      • Sandwiches – i-wrap sa foil para hindi matuyo (Wrap in foil to prevent drying)<br>
      • Prutas – hiwain lang sa umaga bago mag-pack (Cut fruits only in the morning)
    </p>
  </div>`;
  document.getElementById('print-content').innerHTML=html;
  document.getElementById('print-modal').classList.add('show');
}
function closePrint(){document.getElementById('print-modal').classList.remove('show');}

updateWeekLabel();
renderDays();
</script>
</body>
</html>
